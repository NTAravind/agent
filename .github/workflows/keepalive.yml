name: Supabase keepalive

# Supabase pauses free projects after 1 week of inactivity. This cron pings the
# REST API every 3 days so the project stays awake.
on:
  schedule:
    - cron: "17 6 */3 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set; nothing to do."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          echo "Supabase responded with HTTP ${code}"
          case "${code}" in
            2*|404) echo "Supabase is awake." ;;
            *) echo "Supabase did not accept the credentials (HTTP ${code})."; exit 1 ;;
          esac
